server.address=127.0.0.1
server.port=${PORT:8088}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/news_popularity?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-init-sql=SET time_zone = '+08:00'
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.data.redis.host=127.0.0.1
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
news.python=${NEWS_PYTHON:python}
news.analysis=${NEWS_ANALYSIS:python}
server.error.include-message=never
