<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新闻热度预测</title><link rel="stylesheet" href="/assets/app.css"><style>
body{margin:0;background:#f3f5f7;color:#263238;font-family:Microsoft YaHei,Arial} [v-cloak]{display:none}.login{width:360px;margin:12vh auto}.shell{min-height:100vh}.aside{background:#fff;border-right:1px solid #ddd}.brand{padding:24px 18px;font-size:18px;font-weight:bold}.top{background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between}.main{max-width:1150px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.graph{max-width:100%;max-height:620px}.hint{color:#777;font-size:13px;line-height:1.6}.result{margin-top:16px}.footer{color:#777;font-size:12px;margin-top:24px}@media(max-width:700px){.grid{grid-template-columns:1fr}.aside{width:150px!important}.login{width:85%}}
</style></head><body><div id="app" v-cloak>
<el-card v-if="!authenticated" class="login"><h2>新闻热度预测</h2><p class="hint">请登录后使用系统</p><el-form @submit.native.prevent="login"><el-form-item><el-input v-model="user" placeholder="账号" autocomplete="username"></el-input></el-form-item><el-form-item><el-input v-model="password" type="password" placeholder="密码" autocomplete="current-password" show-password></el-input></el-form-item><el-button type="primary" native-type="submit" style="width:100%">登录</el-button></el-form></el-card>
<el-container v-else class="shell"><el-aside width="200px" class="aside"><div class="brand">新闻热度预测</div><el-menu :default-active="page" @select="go"><el-menu-item index="predict">新闻预测</el-menu-item><el-menu-item index="analysis">数据分析</el-menu-item><el-menu-item index="records">预测记录</el-menu-item></el-menu></el-aside><el-container><el-header class="top"><strong>网络新闻热度预测</strong><el-button size="small" @click="logout">退出登录</el-button></el-header><el-main><div class="main">
<el-card v-if="page==='predict'"><h3>输入新闻特征</h3><p class="hint">预测新闻是否达到 1400 次分享。模型使用 Mashable 历史英文新闻的统计特征。</p><el-form label-position="top" size="small"><el-form-item label="选择模型"><el-select v-model="model"><el-option label="随机森林" value="random_forest"></el-option><el-option label="决策树" value="decision_tree"></el-option></el-select></el-form-item><div class="grid"><el-form-item v-for="(key,i) in schema.features" :key="key" :label="schema.labels[i]"><el-input v-model="features[key]" type="number"></el-input></el-form-item></div><el-button type="primary" :loading="busy" @click="predict">预测并保存</el-button><el-button @click="sample">填入数据示例</el-button></el-form><el-alert v-if="result" class="result" :closable="false" type="success" :title="'预测结果：'+result.label+'；热度概率：'+percent(result.probability)"></el-alert><p class="hint">结果是对历史数据的估计，不保证实际传播效果。</p></el-card>
<el-card v-if="page==='analysis'"><h3>数据分析与模型评估</h3><p class="hint">图表与指标来自期中训练结果。</p><el-select v-model="figure" size="small"><el-option label="类别分布" value="01_class_distribution"></el-option><el-option label="箱线图" value="02_boxplots"></el-option><el-option label="相关性热力图" value="03_correlation"></el-option><el-option label="决策树混淆矩阵" value="04_confusion_decision_tree"></el-option><el-option label="随机森林混淆矩阵" value="04_confusion_random_forest"></el-option><el-option label="特征重要性" value="05_feature_importance"></el-option><el-option label="模型对比" value="06_model_comparison"></el-option></el-select><div><img class="graph" :src="'/api/figure/'+figure" alt="数据分析图表"></div></el-card>
<el-card v-if="page==='records'"><h3>预测记录</h3><el-table :data="records" stripe><el-table-column prop="id" label="编号" width="75"></el-table-column><el-table-column prop="model" label="模型"></el-table-column><el-table-column prop="label" label="预测结果"></el-table-column><el-table-column label="概率"><template slot-scope="scope">{{percent(scope.row.probability)}}</template></el-table-column><el-table-column prop="createdAt" label="时间" width="180"></el-table-column><el-table-column label="操作" width="100"><template slot-scope="scope"><el-button type="text" @click="remove(scope.row.id)">删除</el-button></template></el-table-column></el-table></el-card>
<div class="footer">数据来源：UCI Online News Popularity，CC BY 4.0</div></div></el-main></el-container></el-container></div><script src="/assets/app.js"></script></body></html>
